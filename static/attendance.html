<h2>&#128197; Attendance Module</h2>

<section>

  <div class="filter-row">
    <label>Location:
      <select id="attLocation" style="min-width:140px;"><option value="">Select</option></select>

      <select id="attWarehouse" style="min-width:140px;"><option value="">Select</option></select>

    <label>Month:
      <select id="attMonth" style="min-width:120px;"></select>

      <select id="attYear" style="min-width:90px;"></select>

<script>
const MONTH_NAMES = ["","January","February","March","April","May","June",
                     "July","August","September","October","November","December"];
const PAY_STATUSES = new Set(["p","sl","pl","hp"]);

let WAREHOUSES = {};
let currentLocation = "", currentWarehouse = "";
let currentMonth = 0, currentYear = 0;
let currentPeriodDates = [];
let currentPolicy = {};

function esc(v) {
  return String(v ?? '').replace(/[&<>"]/g, m =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
}

function localISODate(d) {
  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

async function boot() {
  const res = await fetch('/warehouses');
  WAREHOUSES = await res.json();

  const locSel = document.getElementById('attLocation');
  locSel.innerHTML = '<option value="">Select location</option>' +
    Object.keys(WAREHOUSES).map(l => `<option value="${esc(l)}">${esc(l)}</option>`).join('');
  locSel.addEventListener('change', () => {
    populateWarehouse();
  });

  populateMonthYear();

  function autoRefresh() {
    if (document.getElementById('attLocation').value && document.getElementById('attWarehouse').value) {
      loadAttendance();
    }
  }
  document.getElementById('attMonth').addEventListener('change', autoRefresh);
  document.getElementById('attYear').addEventListener('change', autoRefresh);
}

function populateWarehouse() {
  const loc = document.getElementById('attLocation').value;
  const whs = WAREHOUSES[loc] || [];
  document.getElementById('attWarehouse').innerHTML =
    '<option value="">Select warehouse</option>' +
    whs.map(w => `<option value="${esc(w)}">${esc(w)}</option>`).join('');
}

function populateMonthYear() {
  const now  = new Date();
  const mSel = document.getElementById('attMonth');
  const ySel = document.getElementById('attYear');
  mSel.innerHTML = Array.from({length:12}, (_,i) =>
    `<option value="${i+1}"${i+1===now.getMonth()+1?' selected':''}>${MONTH_NAMES[i+1]}</option>`
  ).join('');
  const years = [now.getFullYear()-1, now.getFullYear(), now.getFullYear()+1];
  ySel.innerHTML = years.map(y =>
    `<option value="${y}"${y===now.getFullYear()?' selected':''}>${y}</option>`
  ).join('');
}

function getPayrollPeriodDates(month, year) {
  // Payroll period from 26th of previous month to the 25th of the current month
  const start = new Date(year, month - 2, 26);
  const end = new Date(year, month - 1, 25); // 25th of current month
  const dates = [];
  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
    dates.push(new Date(d));
  }
  return dates;
}

async function loadAttendance() {
  currentLocation  = document.getElementById('attLocation').value;
  currentWarehouse = document.getElementById('attWarehouse').value;
  currentMonth     = parseInt(document.getElementById('attMonth').value);
  currentYear      = parseInt(document.getElementById('attYear').value);

  if (!currentLocation || !currentWarehouse) {
    alert('Please select both Location and Warehouse.');
    return;
  }

  const params = new URLSearchParams({
    location: currentLocation, warehouse: currentWarehouse,
    month: currentMonth, year: currentYear,
  });

  const res  = await fetch('/attendance/employees?' + params.toString());
  if (!res.ok) { alert('Failed to load employees: ' + await res.text()); return; }
  const data = await res.json();
  currentPolicy = data.policy || {};

  currentPeriodDates = getPayrollPeriodDates(currentMonth, currentYear);
  document.getElementById('attTitle').textContent =
    `${MONTH_NAMES[currentMonth]} ${currentYear} — ${currentLocation} / ${currentWarehouse}`;
  document.getElementById('attSection').style.display = '';
  renderTable(data.employees);
}

function renderTable(employees) {
  const dates = currentPeriodDates;
  const DAY_ABBR = ['Su','Mo','Tu','We','Th','Fr','Sa'];

  let abmCount = 0;
  let acmCount = 0;
  for (const date of dates) {
    if (date.getMonth() === (currentMonth - 2 < 0 ? 11 : currentMonth - 2)) abmCount++;
    else acmCount++;
  }

  let head = `<thead>
    <tr>
      <th colspan="5" style="background:#fef3c7; color:#92400e; text-align:center;">Employee Details</th>
      <th colspan="${abmCount}" style="background:#e0e7ff; color:#3730a3; text-align:center;">ABM (Attendance Before Month)</th>
      <th colspan="${acmCount}" style="background:#dcfce7; color:#166534; text-align:center;">ACM (Attendance Current Month)</th>
      <th colspan="7" style="background:#fef3c7; color:#92400e; text-align:center;">Summary</th>
    </tr>
    <tr>
      <th style="min-width:70px; background:#fef3c7; color:#92400e;">Action</th>
      <th style="min-width:90px; background:#fef3c7; color:#92400e;">ID</th>
      <th style="min-width:140px; background:#fef3c7; color:#92400e;">Name</th>
      <th style="min-width:120px; background:#fef3c7; color:#92400e;">Department</th>
      <th style="min-width:120px; background:#fef3c7; color:#92400e;">Designation</th>`;

  for (const date of dates) {
    const dow  = date.getDay();
    let classes = [];
    
    const isABM = date.getMonth() === (currentMonth - 2 < 0 ? 11 : currentMonth - 2);
    if (isABM) classes.push('th-abm');
    else classes.push('th-acm');
    
    if (dow === 0) classes.push('weekend');
    if (date.getDate() > 25 && date.getMonth() === currentMonth - 1) classes.push('next-cycle');
    
    const classAttr = classes.length > 0 ? ` class="${classes.join(' ')}"` : '';
    head += `<th${classAttr}>${date.getDate()}</th>`;
  }
  
  head += `<th style="background:#fef3c7; color:#92400e;">Working Days</th>
           <th style="background:#fef3c7; color:#92400e;">Present Days</th>
           <th style="background:#fef3c7; color:#92400e;">Paid Days</th>
           <th style="background:#fef3c7; color:#92400e;">LOP</th>
           <th style="background:#fef3c7; color:#92400e;" class="absent">Absent Days</th>
           <th style="background:#e0e7ff; color:#3730a3;">Total ABM</th>
           <th style="background:#dcfce7; color:#166534;">Total ACM</th>
         </tr>
       </thead>`;

  let body = '<tbody>';
  for (const emp of employees) {
    body += `<tr data-emp-id="${esc(emp.emp_id)}" data-working-days="${emp.working_days || 0}" data-working-source="${esc(emp.working_source || 'Unknown')}">`;
    body += `<td>
      <div style="display:flex; gap:4px; justify-content:center;">
        <button class="btn-att-save" onclick="saveAttendanceEmployee('${esc(emp.emp_id)}')">Save</button>
        <button class="btn-att-delete" onclick="deleteAttendanceEmployee('${esc(emp.emp_id)}')">Del</button>
      </div>
    </td>`;
    body += `<td class="emp-info">${esc(emp.emp_id)}</td>`;
    body += `<td class="emp-info">${esc(emp.emp_name)}</td>`;
    body += `<td class="emp-info">${esc(emp.department || '')}</td>`;
    body += `<td class="emp-info">${esc(emp.designation || '')}</td>`;
    
    let working = 0, present = emp.present_days || 0, absent = emp.absent_days || 0;
    let dayCells = '';
    
    let dojDate = null;
    if (emp.doj) {
      let parts = emp.doj.split(/[-.\/ ]/);
      if (parts.length === 3) {
        if (parts[0].length === 4) dojDate = new Date(parts[0], parts[1]-1, parts[2]);
        else if (parts[2].length === 4) dojDate = new Date(parts[2], parts[1]-1, parts[0]);
      }
    }

    for (const date of dates) {
      const key = localISODate(date);
      const fallback = emp.days[String(date.getDate())];
      let val = ((emp.days[key] !== undefined ? emp.days[key] : fallback) || '').toString().toUpperCase();
      const dow  = date.getDay();
      
      let disabledAttr = '';
      if (dojDate && date < dojDate) {
         disabledAttr = ' disabled style="background:rgba(255,255,255,0.05); color:transparent; cursor:not-allowed;" title="Before DOJ"';
         val = '';
      }
      
      if (dow === 0 && !val && !disabledAttr) {
        val = 'WO';
      }
      
      let classes = [];
      const isABM = date.getMonth() === (currentMonth - 2 < 0 ? 11 : currentMonth - 2);
      if (isABM) classes.push('td-abm');
      else classes.push('td-acm');
      
      if (dow === 0) classes.push('weekend');
      if (date.getDate() > 25 && date.getMonth() === currentMonth - 1) classes.push('next-cycle');
      const classAttr = classes.length > 0 ? ` class="${classes.join(' ')}"` : '';

      const valid = Object.keys(currentPolicy);
      const cls = valid.includes(val) ? 'status-' + val.toLowerCase() : 'status-blank';
      dayCells += `<td${classAttr}><input class="day-inp ${cls}" type="text" maxlength="2"`
            + ` data-day="${key}" value="${esc(val)}" oninput="onDayInput(this)"${disabledAttr}></td>`;
            
      const v = val.toLowerCase();
      // Initial render doesn't compute working/present; we'll recalculate exactly at the end
    }
    
    body += dayCells;
    body += `<td class="summary" data-type="working">0</td>`;
    body += `<td class="summary" data-type="present">0</td>`;
    body += `<td class="summary" data-type="pay">0</td>`;
    body += `<td class="summary" data-type="lop">0</td>`;
    body += `<td class="summary absent" data-type="absent">0</td>`;
    body += `<td class="summary" data-type="abm" style="background: rgba(224, 231, 255, 0.1);">0</td>`;
    body += `<td class="summary" data-type="acm" style="background: rgba(220, 252, 231, 0.1);">0</td>`;
    body += '</tr>';
  }
  body += '</tbody>';
  document.getElementById('attTable').innerHTML = head + body;
  
  // Re-run summary computation for all rows to ensure exact 26th-25th calculation
  document.querySelectorAll('#attTable tbody tr').forEach(tr => {
    const firstInp = tr.querySelector('input.day-inp');
    if (firstInp) onDayInput(firstInp);
  });
}

function onDayInput(inp) {
  let uiVal = inp.value.trim().toUpperCase();
  inp.value = uiVal;

  let logicalVal = uiVal;
  if (!uiVal) {
     const dt = new Date(inp.dataset.day);
     if (dt.getDay() === 0) logicalVal = 'WO';
     else logicalVal = 'A';
  }

  const valid = Object.keys(currentPolicy);
  const cls = valid.includes(uiVal) ? 'status-' + uiVal.toLowerCase() : 'status-blank';
  inp.className = 'day-inp ' + cls;

  // live summary
  const tr = inp.closest('tr');
  let present = 0, absent = 0, lop = 0;
  let abmTotal = 0, acmTotal = 0;
  const working = parseFloat(tr.dataset.workingDays) || 0;
  const workingSource = tr.dataset.workingSource || "Unknown";
  
  const cutoffStart = localISODate(new Date(currentYear, currentMonth - 2, 26));
  const cutoffEnd = localISODate(new Date(currentYear, currentMonth - 1, 25));

  tr.querySelectorAll('input.day-inp').forEach(i => {
    const dStr = i.dataset.day;
    let v = i.value.trim().toUpperCase();
    if (!v) {
       const dt = new Date(dStr);
       if (dt.getDay() === 0) v = 'WO';
       else v = 'A';
    }

    const isABM = i.closest('td').classList.contains('td-abm');
    if (currentPolicy[v]) {
       let pDay = currentPolicy[v].paid ? 1 : 0;
       if (isABM) abmTotal += pDay;
       else acmTotal += pDay;
    }

    if (dStr >= cutoffStart && dStr <= cutoffEnd) {
      if (currentPolicy[v]) {
         lop += currentPolicy[v].lop || 0;
         if (v === 'A' || (currentPolicy[v].name && currentPolicy[v].name.toLowerCase() === 'absent')) absent += 1;
      } else {
         lop += 1;
         absent += 1;
      }
    }
  });
  
  const pay = Math.max(0, working - lop);
  present = pay;  // Present Days is padded to match Working Days - LOP
  
  tr.querySelector('[data-type="working"]').textContent = working;
  tr.querySelector('[data-type="present"]').textContent = present;
  tr.querySelector('[data-type="absent"]').textContent  = absent;
  tr.querySelector('[data-type="pay"]').textContent     = pay;
  tr.querySelector('[data-type="lop"]').textContent     = lop;
  tr.querySelector('[data-type="abm"]').textContent     = abmTotal;
  tr.querySelector('[data-type="acm"]').textContent     = acmTotal;
}

async function saveAllAttendance() {
  const statusEl = document.getElementById('attStatus');
  statusEl.style.color = 'green';
  statusEl.textContent = 'Saving...';

  const rows = document.querySelectorAll('#attTable tbody tr');
  let saved = 0, failed = 0;

  for (const tr of rows) {
    const empId = tr.dataset.empId;
    const days  = {};
    tr.querySelectorAll('input.day-inp').forEach(inp => {
      days[inp.dataset.day] = inp.value.trim().toUpperCase();
    });

    try {
      const res = await fetch(
        `/attendance/${encodeURIComponent(currentLocation)}`
        + `/${encodeURIComponent(currentWarehouse)}`
        + `/${encodeURIComponent(empId)}`,
        {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ month: currentMonth, year: currentYear, days }),
        }
      );
      if (!res.ok) throw new Error(await res.text());
      saved++;
    } catch (e) {
      console.error('Failed for', empId, e);
      failed++;
    }
  }

  if (failed === 0) {
    statusEl.textContent = `Saved ${saved} employee(s) \u2713`;
    setTimeout(() => { statusEl.textContent = ''; }, 3000);
  } else {
    statusEl.style.color = 'red';
    statusEl.textContent = `${saved} saved, ${failed} failed`;
  }
}

async function saveAttendanceEmployee(empId) {
  const statusEl = document.getElementById('attStatus');
  statusEl.style.color = 'green';
  statusEl.textContent = `Saving ${empId}...`;

  const tr = document.querySelector(`tr[data-emp-id="${esc(empId)}"]`);
  if (!tr) return;

  const days  = {};
  tr.querySelectorAll('input.day-inp').forEach(inp => {
    days[inp.dataset.day] = inp.value.trim().toUpperCase();
  });

  try {
    const res = await fetch(
      `/attendance/${encodeURIComponent(currentLocation)}`
      + `/${encodeURIComponent(currentWarehouse)}`
      + `/${encodeURIComponent(empId)}`,
      {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ month: currentMonth, year: currentYear, days }),
      }
    );
    if (!res.ok) throw new Error(await res.text());
    statusEl.textContent = `Saved ${empId} \u2713`;
    setTimeout(() => { if(statusEl.textContent.includes(empId)) statusEl.textContent = ''; }, 3000);
  } catch (e) {
    console.error('Failed to save', empId, e);
    statusEl.style.color = 'red';
    statusEl.textContent = `Failed to save ${empId}`;
  }
}

async function deleteAttendanceEmployee(empId) {
  let scope = '';
  if (confirm(`Do you want to permanently delete employee ${empId} from ${currentLocation}/${currentWarehouse} for ALL months?\n\n(This deletes the master record and all historical data)`)) {
    scope = 'all';
  } else if (confirm(`Do you want to delete employee ${empId} for the CURRENT selected month ONLY?\n\n(This preserves the master record and other months)`)) {
    scope = 'month';
  } else {
    return;
  }

  const statusEl = document.getElementById('attStatus');
  statusEl.style.color = 'green';
  statusEl.textContent = 'Deleting...';
  try {
    let url = `/employee/${encodeURIComponent(currentLocation)}/${encodeURIComponent(currentWarehouse)}/${encodeURIComponent(empId)}?scope=${scope}`;
    if (scope === 'month') {
      if (!currentMonth || !currentYear) {
        alert("Please select a Month and Year to delete for a single month.");
        statusEl.textContent = '';
        return;
      }
      url += `&month=${currentMonth}&year=${currentYear}`;
    }
    const res = await fetch(url, { method: 'DELETE' });
    if (!res.ok) throw new Error(await res.text());
    statusEl.textContent = `Deleted ${empId} ✓`;
    loadAttendance();
  } catch (err) {
    statusEl.style.color = 'red';
    statusEl.textContent = 'Delete failed: ' + err.message;
  }
}

async function downloadAttendanceExcel() {
  const loc = document.getElementById('attLocation').value;
  const wh = document.getElementById('attWarehouse').value;
  const month = document.getElementById('attMonth').value;
  const year = document.getElementById('attYear').value;

  if (!loc || !wh) {
    alert('Please select both Location and Warehouse first.');
    return;
  }

  const params = new URLSearchParams({
    location: loc,
    warehouse: wh,
    month: month,
    year: year
  });
  window.open('/attendance/download?' + params.toString(), '_blank');
}

boot();
